worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'host=$host tenant_slug=$tenant_slug';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Optimization settings
    sendfile        on;
    keepalive_timeout  65;

    # Tenant from Host. Reserved labels are not a developer.
    # acme.localhost → acme; app.localhost / localhost → empty (header omitted).
    # An empty value also drops any client-supplied X-Tenant-Slug.
    map $host $tenant_slug {
        default "";
        ~*^(www|app|api|mail|status|admin|localhost)\.(localhost|lots\.com)$ "";
        ~*^(localhost|lots\.com)$ "";
        ~*^([a-z0-9-]+)\.(localhost|lots\.com)$ $1;
    }

    # Define upstream servers mapping to Docker internal service names and ports
    upstream auth_backend {
        server auth-service:8000;
    }

    upstream users_backend {
        server users-service:8000;
    }

    # etapa 7: uncomment with resources-service in compose
    # upstream resources_backend {
    #     server resources-service:8000;
    # }

    server {
        listen 80 default_server;
        server_name _;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # =====================================================================
        # PUBLIC ROUTES
        # Authentication endpoints
        # =====================================================================
        location /api/v1/auth/ {
            proxy_pass http://auth_backend;
        }

        location = /api/v1/users/docs {
            proxy_pass http://users_backend;
        }

        location = /api/v1/users/openapi.json {
            proxy_pass http://users_backend;
        }

        # =====================================================================
        # PROTECTED ROUTES
        # User endpoints
        # AI endpoints
        # =====================================================================
        location /api/v1/users/ {
            auth_request /_verify_jwt;

            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-Tenant-Slug $tenant_slug;

            proxy_pass http://users_backend;
        }

        # location /api/v1/resources/ {
        #     auth_request /_verify_jwt;
        #
        #     auth_request_set $user_id $upstream_http_x_user_id;
        #     proxy_set_header X-User-Id $user_id;
        #     proxy_set_header X-Tenant-Slug $tenant_slug;
        #
        #     proxy_pass http://resources_backend;
        # }

        # =====================================================================
        # INTERNAL VALIDATION ENDPOINT
        # =====================================================================
        location = /_verify_jwt {
            internal;
            # This route is hidden and handles token verification
            proxy_pass http://auth_backend/api/v1/auth/verify;

            # Optimize the subrequest by stripping the client request body
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            # Pass original authorization header and cookie to the endpoint
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
        }

        # Error Handling for Authentication Failures
        error_page 401 = @error401;
        location @error401 {
            return 401 '{"error": "Unauthorized", "message": "Invalid or expired JSON Web Token"}';
        }

        error_page 403 = @error403;
        location @error403 {
            default_type application/json;
            return 403 '{"error": "Forbidden", "message": "Not a member of this developer"}';
        }
    }
}
