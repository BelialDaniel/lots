worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Optimization settings
    sendfile        on;
    keepalive_timeout  65;

    # Define upstream servers mapping to Docker internal service names and ports
    upstream auth_backend {
        server auth-service:8000;
    }

    upstream users_backend {
        server users-service:8000;
    }

    upstream resources_backend {
        server resources-service:8000;
    }

    server {
        listen 80;
        server_name localhost;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # =====================================================================
        # PUBLIC ROUTES
        # Authentication endpoints
        # =====================================================================
        location /api/v1/auth/ {
            proxy_pass http://auth_backend;
        }

        # =====================================================================
        # PROTECTED ROUTES
        # User endpoints
        # AI endpoints
        # =====================================================================
        location /api/v1/users/ {
            #auth_request /_verify_jwt;

            #auth_request_set $user_id $upstream_http_x_user_id;
            #proxy_set_header X-User-Id $user_id;

            proxy_pass http://users_backend;
        }

        location /api/v1/resources/ {
            auth_request /_verify_jwt;
            
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;

            proxy_pass http://resources_backend;
        }

        # =====================================================================
        # INTERNAL VALIDATION ENDPOINT
        # =====================================================================
        location = /_verify_jwt {
            internal;
            # This route is hidden and handles token verification
            proxy_pass http://auth_backend/api/v1/auth/verify;
            
            # Optimize the subrequest by stripping the client request body
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            
            # Pass original authorization header to the endpoint
            proxy_set_header Authorization $http_authorization;
        }

        # Error Handling for Authentication Failures
        error_page 401 = @error401;
        location @error401 {
            return 401 '{"error": "Unauthorized", "message": "Invalid or expired JSON Web Token"}';
        }
    }
}
